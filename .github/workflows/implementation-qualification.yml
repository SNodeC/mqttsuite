name: MQTTSuite build

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/implementation-qualification.yml'
      - 'CMakeLists.txt'
      - '**/CMakeLists.txt'
      - 'lib/**'
      - 'mqttbroker/**'
      - 'mqttintegrator/**'
      - 'mqttbridge/**'
      - 'mqttcli/**'
      - 'mqttstore/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SNODEC_SHA: 5d6453c21df4894083b445cce00b627e7794932a

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare dependency prefix
        shell: bash
        run: echo "PREFIX=$RUNNER_TEMP/snodec-prefix" >> "$GITHUB_ENV"

      - name: Check out pinned SNode.C
        uses: actions/checkout@v4
        with:
          repository: SNodeC/snode.c
          ref: ${{ env.SNODEC_SHA }}
          path: _snodec
          fetch-depth: 1

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            libbluetooth-dev \
            libmagic-dev \
            libmariadb-dev \
            libssl-dev \
            nlohmann-json3-dev \
            pkg-config

      - name: Build and install pinned SNode.C
        shell: bash
        run: |
          set -euo pipefail
          cmake -S _snodec -B _snodec-build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSNODEC_BUILD_TESTS=OFF \
            -DSNODEC_BUILD_APPS=OFF \
            -DCMAKE_INSTALL_PREFIX="$PREFIX"
          cmake --build _snodec-build --parallel 8
          cmake --install _snodec-build

      - name: Configure MQTTSuite
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$PREFIX"

      - name: Build MQTTSuite
        shell: bash
        run: cmake --build build --parallel 8
