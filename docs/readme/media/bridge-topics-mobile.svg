<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 1128" role="img" aria-labelledby="mqttsuite-bridge-topics-mobile-title mqttsuite-bridge-topics-mobile-desc"><title id="mqttsuite-bridge-topics-mobile-title">MQTTBridge topic composition</title><desc id="mqttsuite-bridge-topics-mobile-desc">A to B: relay/ plus a/ plus b/ plus telemetry/temperature. B to A: relay/ plus b/ plus a/ plus commands/light. The payload is unchanged and relay/ output topics do not match either input subscription.</desc><defs><linearGradient id="mqttsuite-bridge-topics-mobile-bg" x2="1" y2="1"><stop stop-color="#101f35"/><stop offset="1" stop-color="#172f47"/></linearGradient><marker id="mqttsuite-bridge-topics-mobile-arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 8 8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#6b7f96" stroke-width="1.5"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="640" height="1128" rx="22" fill="#f5faf8" stroke="none"/><text x="32" y="48" font-size="28" fill="#14243b" font-weight="700">FOLLOW THE TOPIC</text><text x="32" y="83" font-size="23" fill="#506178" font-weight="400">Two independent directions;</text><text x="32" y="113" font-size="23" fill="#506178" font-weight="400">the payload stays unchanged.</text><text x="32" y="160" font-size="23" fill="#246087" font-weight="700">BROKER A → B</text><rect x="32" y="182" width="576" height="100" rx="14" fill="#ffffff" stroke="#ccddd7"/><text x="52" y="218" font-size="26" fill="#14243b" font-weight="700">telemetry/temperature</text><text x="52" y="255" font-size="22" fill="#506178" font-weight="400">Input subscription: telemetry/#</text><path d="M320 288L320 319" fill="none" stroke="#6b7f96" stroke-width="2.5" marker-end="url(#mqttsuite-bridge-topics-mobile-arrow)"/><rect x="32" y="325" width="576" height="110" rx="14" fill="#eef4f1" stroke="#ccddd7"/><text x="52" y="355" font-size="21" fill="#506178" font-weight="700">BRIDGE + SOURCE + DESTINATION</text><text x="52" y="386" font-size="27" fill="#14243b" font-weight="700">relay/ + a/ + b/</text><text x="52" y="418" font-size="22" fill="#506178" font-weight="400">+ original topic</text><path d="M320 441L320 467" fill="none" stroke="#6b7f96" stroke-width="2.5" marker-end="url(#mqttsuite-bridge-topics-mobile-arrow)"/><rect x="32" y="473" width="576" height="70" rx="14" fill="#dff1e9" stroke="#bdd7cb"/><text x="52" y="516" font-size="23" fill="#14243b" font-weight="700">relay/a/b/telemetry/temperature</text><text x="32" y="610" font-size="23" fill="#23745f" font-weight="700">BROKER B → A</text><rect x="32" y="632" width="576" height="100" rx="14" fill="#ffffff" stroke="#ccddd7"/><text x="52" y="668" font-size="26" fill="#14243b" font-weight="700">commands/light</text><text x="52" y="705" font-size="22" fill="#506178" font-weight="400">Input subscription: commands/#</text><path d="M320 738L320 769" fill="none" stroke="#6b7f96" stroke-width="2.5" marker-end="url(#mqttsuite-bridge-topics-mobile-arrow)"/><rect x="32" y="775" width="576" height="110" rx="14" fill="#eef4f1" stroke="#ccddd7"/><text x="52" y="805" font-size="21" fill="#506178" font-weight="700">BRIDGE + SOURCE + DESTINATION</text><text x="52" y="836" font-size="27" fill="#14243b" font-weight="700">relay/ + b/ + a/</text><text x="52" y="868" font-size="22" fill="#506178" font-weight="400">+ original topic</text><path d="M320 891L320 917" fill="none" stroke="#6b7f96" stroke-width="2.5" marker-end="url(#mqttsuite-bridge-topics-mobile-arrow)"/><rect x="32" y="923" width="576" height="70" rx="14" fill="#dff1e9" stroke="#bdd7cb"/><text x="52" y="966" font-size="23" fill="#14243b" font-weight="700">relay/b/a/commands/light</text><text x="32" y="1039" font-size="23" fill="#14243b" font-weight="700">Relayed topics start with relay/.</text><text x="32" y="1071" font-size="21" fill="#506178" font-weight="400">Neither telemetry/# nor commands/#</text><text x="32" y="1101" font-size="21" fill="#506178" font-weight="400">matches those relayed topics.</text></g></svg>
