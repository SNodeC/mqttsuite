<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 1000" role="img" aria-labelledby="mqttsuite-bridge-topics-mobile-title mqttsuite-bridge-topics-mobile-desc"><title id="mqttsuite-bridge-topics-mobile-title">MQTTBridge topic composition</title><desc id="mqttsuite-bridge-topics-mobile-desc">A to B: relay/ plus a/ plus b/ plus telemetry/temperature. B to A: relay/ plus b/ plus a/ plus commands/light. The payload is unchanged and relay/ output topics do not match either input subscription.</desc><defs><linearGradient id="mqttsuite-bridge-topics-mobile-bg" x2="1" y2="1"><stop stop-color="#101f35"/><stop offset="1" stop-color="#172f47"/></linearGradient><marker id="mqttsuite-bridge-topics-mobile-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 8 8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#7c8fa5" stroke-width="1.5"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="640" height="1000" rx="22" fill="#f5faf8" stroke="none"/><text x="32" y="48" font-size="28" fill="#14243b" font-weight="700">FOLLOW THE TOPIC</text><text x="32" y="83" font-size="23" fill="#506178" font-weight="400">The payload stays unchanged.</text><text x="32" y="116" font-size="23" fill="#246087" font-weight="700">BROKER A → B</text><rect x="32" y="138" width="576" height="100" rx="14" fill="#ffffff" stroke="#ccddd7"/><text x="52" y="174" font-size="26" fill="#14243b" font-weight="700">telemetry/temperature</text><text x="52" y="211" font-size="22" fill="#506178" font-weight="400">Input subscription: telemetry/#</text><path d="M320 243L320 273" fill="none" stroke="#7c8fa5" stroke-width="3" marker-end="url(#mqttsuite-bridge-topics-mobile-arrow)"/><text x="52" y="306" font-size="21" fill="#506178" font-weight="700">BRIDGE + SOURCE + DESTINATION</text><text x="52" y="342" font-size="27" fill="#14243b" font-weight="700">relay/ + a/ + b/</text><text x="52" y="374" font-size="22" fill="#506178" font-weight="400">+ original topic</text><path d="M320 384L320 415" fill="none" stroke="#7c8fa5" stroke-width="3" marker-end="url(#mqttsuite-bridge-topics-mobile-arrow)"/><rect x="32" y="425" width="576" height="70" rx="14" fill="#dff1e9" stroke="#bdd7cb"/><text x="52" y="468" font-size="23" fill="#14243b" font-weight="700">relay/a/b/telemetry/temperature</text><text x="32" y="526" font-size="23" fill="#23745f" font-weight="700">BROKER B → A</text><rect x="32" y="548" width="576" height="100" rx="14" fill="#ffffff" stroke="#ccddd7"/><text x="52" y="584" font-size="26" fill="#14243b" font-weight="700">commands/light</text><text x="52" y="621" font-size="22" fill="#506178" font-weight="400">Input subscription: commands/#</text><path d="M320 653L320 683" fill="none" stroke="#7c8fa5" stroke-width="3" marker-end="url(#mqttsuite-bridge-topics-mobile-arrow)"/><text x="52" y="716" font-size="21" fill="#506178" font-weight="700">BRIDGE + SOURCE + DESTINATION</text><text x="52" y="752" font-size="27" fill="#14243b" font-weight="700">relay/ + b/ + a/</text><text x="52" y="784" font-size="22" fill="#506178" font-weight="400">+ original topic</text><path d="M320 794L320 825" fill="none" stroke="#7c8fa5" stroke-width="3" marker-end="url(#mqttsuite-bridge-topics-mobile-arrow)"/><rect x="32" y="835" width="576" height="70" rx="14" fill="#dff1e9" stroke="#bdd7cb"/><text x="52" y="878" font-size="23" fill="#14243b" font-weight="700">relay/b/a/commands/light</text><text x="32" y="941" font-size="23" fill="#14243b" font-weight="700">Relayed topics start with relay/.</text><text x="32" y="973" font-size="21" fill="#506178" font-weight="400">Neither input subscription matches that prefix.</text></g></svg>
