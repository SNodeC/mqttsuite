<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 640" role="img" aria-labelledby="mqttsuite-bridge-topics-title mqttsuite-bridge-topics-desc"><title id="mqttsuite-bridge-topics-title">MQTTBridge topic composition</title><desc id="mqttsuite-bridge-topics-desc">A to B: relay/ plus a/ plus b/ plus telemetry/temperature. B to A: relay/ plus b/ plus a/ plus commands/light. The payload is unchanged and relay/ output topics do not match either input subscription.</desc><defs><linearGradient id="mqttsuite-bridge-topics-bg" x2="1" y2="1"><stop stop-color="#101f35"/><stop offset="1" stop-color="#172f47"/></linearGradient><marker id="mqttsuite-bridge-topics-arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 8 8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#6b7f96" stroke-width="1.5"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="1280" height="640" rx="22" fill="#f5faf8" stroke="none"/><text x="32" y="48" font-size="30" fill="#14243b" font-weight="700">FOLLOW THE TOPIC</text><text x="32" y="83" font-size="24" fill="#506178" font-weight="400">Two independent directions; the payload stays unchanged.</text><text x="32" y="120" font-size="23" fill="#246087" font-weight="700">BROKER A → B</text><rect x="32" y="142" width="592" height="100" rx="14" fill="#ffffff" stroke="#ccddd7"/><text x="52" y="178" font-size="26" fill="#14243b" font-weight="700">telemetry/temperature</text><text x="52" y="215" font-size="22" fill="#506178" font-weight="400">Input subscription: telemetry/#</text><path d="M328 248L328 279" fill="none" stroke="#6b7f96" stroke-width="2.5" marker-end="url(#mqttsuite-bridge-topics-arrow)"/><rect x="32" y="285" width="592" height="110" rx="14" fill="#eef4f1" stroke="#ccddd7"/><text x="52" y="315" font-size="22" fill="#506178" font-weight="700">BRIDGE + SOURCE + DESTINATION</text><text x="52" y="346" font-size="27" fill="#14243b" font-weight="700">relay/ + a/ + b/</text><text x="52" y="378" font-size="22" fill="#506178" font-weight="400">+ original topic</text><path d="M328 401L328 427" fill="none" stroke="#6b7f96" stroke-width="2.5" marker-end="url(#mqttsuite-bridge-topics-arrow)"/><rect x="32" y="433" width="592" height="70" rx="14" fill="#dff1e9" stroke="#bdd7cb"/><text x="52" y="476" font-size="24" fill="#14243b" font-weight="700">relay/a/b/telemetry/temperature</text><text x="656" y="120" font-size="23" fill="#23745f" font-weight="700">BROKER B → A</text><rect x="656" y="142" width="592" height="100" rx="14" fill="#ffffff" stroke="#ccddd7"/><text x="676" y="178" font-size="26" fill="#14243b" font-weight="700">commands/light</text><text x="676" y="215" font-size="22" fill="#506178" font-weight="400">Input subscription: commands/#</text><path d="M952 248L952 279" fill="none" stroke="#6b7f96" stroke-width="2.5" marker-end="url(#mqttsuite-bridge-topics-arrow)"/><rect x="656" y="285" width="592" height="110" rx="14" fill="#eef4f1" stroke="#ccddd7"/><text x="676" y="315" font-size="22" fill="#506178" font-weight="700">BRIDGE + SOURCE + DESTINATION</text><text x="676" y="346" font-size="27" fill="#14243b" font-weight="700">relay/ + b/ + a/</text><text x="676" y="378" font-size="22" fill="#506178" font-weight="400">+ original topic</text><path d="M952 401L952 427" fill="none" stroke="#6b7f96" stroke-width="2.5" marker-end="url(#mqttsuite-bridge-topics-arrow)"/><rect x="656" y="433" width="592" height="70" rx="14" fill="#dff1e9" stroke="#bdd7cb"/><text x="676" y="476" font-size="24" fill="#14243b" font-weight="700">relay/b/a/commands/light</text><text x="32" y="581" font-size="24" fill="#14243b" font-weight="700">Relayed topics start with relay/.</text><text x="32" y="613" font-size="23" fill="#506178" font-weight="400">Neither telemetry/# nor commands/# matches those relayed topics.</text></g></svg>
