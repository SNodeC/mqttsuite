<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 900" role="img" aria-labelledby="mqttsuite-message-flow-mobile-title mqttsuite-message-flow-mobile-desc"><title id="mqttsuite-message-flow-mobile-title">MQTTSuite message paths</title><desc id="mqttsuite-message-flow-mobile-desc">Publishers send to a broker. An integrator subscribes and republishes transformed messages, a bridge exchanges selected messages with another broker, and a store persists messages in MariaDB. These are independent optional roles.</desc><defs><linearGradient id="mqttsuite-message-flow-mobile-bg" x2="1" y2="1"><stop stop-color="#101f35"/><stop offset="1" stop-color="#172f47"/></linearGradient><marker id="mqttsuite-message-flow-mobile-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 8 8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#7c8fa5" stroke-width="1.5"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="640" height="900" rx="22" fill="#f5faf8" stroke="none"/><text x="32" y="46" font-size="22" fill="#14243b" font-weight="700">ONE MESSAGE. SEVERAL USEFUL PATHS.</text><rect x="32" y="80" width="576" height="98" rx="14" fill="#eaf0fa" stroke="#ccddd7"/><text x="54" y="118" font-size="26" fill="#14243b" font-weight="700">Devices / MQTTCli</text><text x="54" y="155" font-size="20" fill="#506178" font-weight="400">Publish and subscribe</text><path d="M320 186L320 206" fill="none" stroke="#7c8fa5" stroke-width="3" marker-end="url(#mqttsuite-message-flow-mobile-arrow)" marker-start="url(#mqttsuite-message-flow-mobile-arrow)"/><rect x="32" y="218" width="576" height="98" rx="14" fill="#daf0e8" stroke="#ccddd7"/><text x="54" y="256" font-size="26" fill="#14243b" font-weight="700">MQTT broker</text><text x="54" y="293" font-size="20" fill="#506178" font-weight="400">MQTTBroker or another MQTT 3.1.1 broker</text><path d="M320 318L320 352" fill="none" stroke="#7c8fa5" stroke-width="3" marker-end="url(#mqttsuite-message-flow-mobile-arrow)"/><text x="40" y="386" font-size="18" fill="#506178" font-weight="700">OPTIONAL APPLICATIONS</text><rect x="32" y="412" width="576" height="98" rx="14" fill="#edf1fb" stroke="#ccddd7"/><text x="54" y="450" font-size="26" fill="#14243b" font-weight="700">MQTTIntegrator</text><text x="54" y="487" font-size="20" fill="#506178" font-weight="400">Subscribe → transform → republish to broker</text><rect x="32" y="540" width="576" height="98" rx="14" fill="#edf1fb" stroke="#ccddd7"/><text x="54" y="578" font-size="26" fill="#14243b" font-weight="700">MQTTBridge</text><text x="54" y="615" font-size="20" fill="#506178" font-weight="400">Relay selected topics ↔ another broker</text><rect x="32" y="668" width="576" height="98" rx="14" fill="#edf1fb" stroke="#ccddd7"/><text x="54" y="706" font-size="26" fill="#14243b" font-weight="700">MQTTStore</text><text x="54" y="743" font-size="20" fill="#506178" font-weight="400">Persist raw data + typed projections → MariaDB</text><text x="32" y="821" font-size="23" fill="#14243b" font-weight="700">Choose applications independently.</text><text x="32" y="858" font-size="21" fill="#506178" font-weight="400">Not a mandatory processing chain.</text></g></svg>
