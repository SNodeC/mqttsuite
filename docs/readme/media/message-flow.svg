<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 660" role="img" aria-labelledby="mqttsuite-message-flow-title mqttsuite-message-flow-desc"><title id="mqttsuite-message-flow-title">MQTTSuite message paths</title><desc id="mqttsuite-message-flow-desc">Publishers send to a broker. An integrator subscribes and republishes transformed messages, a bridge exchanges selected messages with another broker, and a store persists messages in MariaDB. These are independent optional roles.</desc><defs><linearGradient id="mqttsuite-message-flow-bg" x2="1" y2="1"><stop stop-color="#101f35"/><stop offset="1" stop-color="#172f47"/></linearGradient><marker id="mqttsuite-message-flow-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 8 8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#7c8fa5" stroke-width="1.5"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="1280" height="660" rx="22" fill="#f5faf8" stroke="none"/><text x="32" y="46" font-size="26" fill="#14243b" font-weight="700">ONE MESSAGE. SEVERAL USEFUL PATHS.</text><rect x="32" y="94" width="280" height="124" rx="18" fill="#eaf0fa" stroke="#ccddd7"/><text x="56" y="139" font-size="24" fill="#14243b" font-weight="700">Devices / MQTTCli</text><text x="56" y="181" font-size="22" fill="#506178" font-weight="400">Publish · subscribe</text><path d="M320 156L378 156" fill="none" stroke="#7c8fa5" stroke-width="3" marker-end="url(#mqttsuite-message-flow-arrow)" marker-start="url(#mqttsuite-message-flow-arrow)"/><rect x="390" y="94" width="500" height="124" rx="18" fill="#daf0e8" stroke="#ccddd7"/><text x="414" y="138" font-size="29" fill="#14243b" font-weight="700">MQTT broker</text><text x="414" y="180" font-size="21" fill="#506178" font-weight="400">MQTTBroker or another 3.1.1 broker</text><path d="M640 225V265H221V311" fill="none" stroke="#7c8fa5" stroke-width="3" marker-end="url(#mqttsuite-message-flow-arrow)"/><rect x="32" y="322" width="378" height="151" rx="18" fill="#ffffff" stroke="#ccddd7"/><text x="55" y="365" font-size="27" fill="#14243b" font-weight="700">MQTTIntegrator</text><text x="55" y="407" font-size="22" fill="#506178" font-weight="400">Transform topics</text><text x="55" y="440" font-size="22" fill="#506178" font-weight="400">and payloads</text><path d="M640 225V265H640V311" fill="none" stroke="#7c8fa5" stroke-width="3" marker-end="url(#mqttsuite-message-flow-arrow)" marker-start="url(#mqttsuite-message-flow-arrow)"/><rect x="451" y="322" width="378" height="151" rx="18" fill="#ffffff" stroke="#ccddd7"/><text x="474" y="365" font-size="27" fill="#14243b" font-weight="700">MQTTBridge</text><text x="474" y="407" font-size="22" fill="#506178" font-weight="400">Forward selected topics</text><text x="474" y="440" font-size="22" fill="#506178" font-weight="400">between brokers</text><path d="M640 483L640 521" fill="none" stroke="#7c8fa5" stroke-width="3" marker-end="url(#mqttsuite-message-flow-arrow)" marker-start="url(#mqttsuite-message-flow-arrow)"/><path d="M640 225V265H1059V311" fill="none" stroke="#7c8fa5" stroke-width="3" marker-end="url(#mqttsuite-message-flow-arrow)"/><rect x="870" y="322" width="378" height="151" rx="18" fill="#ffffff" stroke="#ccddd7"/><text x="893" y="365" font-size="27" fill="#14243b" font-weight="700">MQTTStore</text><text x="893" y="407" font-size="22" fill="#506178" font-weight="400">Raw envelopes</text><text x="893" y="440" font-size="22" fill="#506178" font-weight="400">and typed projections</text><path d="M1059 483L1059 521" fill="none" stroke="#7c8fa5" stroke-width="3" marker-end="url(#mqttsuite-message-flow-arrow)"/><path d="M32 398H14V72H640V86" fill="none" stroke="#7c8fa5" stroke-width="3" marker-end="url(#mqttsuite-message-flow-arrow)"/><text x="54" y="552" font-size="21" fill="#506178" font-weight="400">Transforms then republishes</text><text x="54" y="582" font-size="21" fill="#506178" font-weight="400">to the same broker ↶</text><rect x="451" y="533" width="378" height="73" rx="18" fill="#e3f0ea" stroke="none"/><text x="475" y="578" font-size="22" fill="#14243b" font-weight="700">Another MQTT broker</text><rect x="870" y="533" width="378" height="73" rx="18" fill="#e3f0ea" stroke="none"/><text x="894" y="578" font-size="22" fill="#14243b" font-weight="700">MariaDB</text><text x="32" y="640" font-size="18" fill="#506178" font-weight="400">Illustrative message paths; applications are optional and can also work with existing brokers.</text></g></svg>
