<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 710" role="img" aria-labelledby="mqttsuite-message-flow-title mqttsuite-message-flow-desc"><title id="mqttsuite-message-flow-title">MQTTSuite message paths</title><desc id="mqttsuite-message-flow-desc">Publishers send to a broker. An integrator subscribes and republishes transformed messages, a bridge exchanges selected messages with another broker, and a store persists messages in MariaDB. These are independent optional roles.</desc><defs><linearGradient id="mqttsuite-message-flow-bg" x2="1" y2="1"><stop stop-color="#101f35"/><stop offset="1" stop-color="#172f47"/></linearGradient><marker id="mqttsuite-message-flow-arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 8 8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#6b7f96" stroke-width="1.5"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="1280" height="710" rx="22" fill="#f5faf8" stroke="none"/><text x="32" y="46" font-size="26" fill="#14243b" font-weight="700">ONE MESSAGE. SEVERAL USEFUL PATHS.</text><rect x="440" y="78" width="400" height="84" rx="18" fill="#eaf0fa" stroke="#ccddd7"/><text text-anchor="middle" x="640" y="112" font-size="27" fill="#14243b" font-weight="700">Devices / MQTTCli</text><text text-anchor="middle" x="640" y="143" font-size="22" fill="#506178" font-weight="400">Publish · subscribe</text><path d="M640 168L640 206" fill="none" stroke="#6b7f96" stroke-width="2.5" marker-end="url(#mqttsuite-message-flow-arrow)" marker-start="url(#mqttsuite-message-flow-arrow)"/><rect x="150" y="212" width="980" height="96" rx="18" fill="#daf0e8" stroke="#ccddd7"/><text x="174" y="251" font-size="27" fill="#14243b" font-weight="700">MQTT broker</text><text x="174" y="285" font-size="22" fill="#506178" font-weight="400">MQTTBroker or another MQTT 3.1.1 broker</text><path d="M221 314L221 366" fill="none" stroke="#6b7f96" stroke-width="2.5" marker-end="url(#mqttsuite-message-flow-arrow)" marker-start="url(#mqttsuite-message-flow-arrow)"/><text x="242" y="345" font-size="18" fill="#506178" font-weight="400">subscribe · republish</text><rect x="32" y="372" width="378" height="140" rx="18" fill="#ffffff" stroke="#ccddd7"/><text x="55" y="413" font-size="27" fill="#14243b" font-weight="700">MQTTIntegrator</text><text x="55" y="453" font-size="22" fill="#506178" font-weight="400">Transform topics</text><text x="55" y="487" font-size="22" fill="#506178" font-weight="400">and payloads</text><path d="M640 314L640 366" fill="none" stroke="#6b7f96" stroke-width="2.5" marker-end="url(#mqttsuite-message-flow-arrow)" marker-start="url(#mqttsuite-message-flow-arrow)"/><text x="661" y="345" font-size="18" fill="#506178" font-weight="400">forward</text><rect x="451" y="372" width="378" height="140" rx="18" fill="#ffffff" stroke="#ccddd7"/><text x="474" y="413" font-size="27" fill="#14243b" font-weight="700">MQTTBridge</text><text x="474" y="453" font-size="22" fill="#506178" font-weight="400">Forward selected topics</text><text x="474" y="487" font-size="22" fill="#506178" font-weight="400">between brokers</text><path d="M640 518L640 566" fill="none" stroke="#6b7f96" stroke-width="2.5" marker-end="url(#mqttsuite-message-flow-arrow)" marker-start="url(#mqttsuite-message-flow-arrow)"/><path d="M1059 314L1059 366" fill="none" stroke="#6b7f96" stroke-width="2.5" marker-end="url(#mqttsuite-message-flow-arrow)"/><text x="1080" y="345" font-size="18" fill="#506178" font-weight="400">subscribe</text><rect x="870" y="372" width="378" height="140" rx="18" fill="#ffffff" stroke="#ccddd7"/><text x="893" y="413" font-size="27" fill="#14243b" font-weight="700">MQTTStore</text><text x="893" y="453" font-size="22" fill="#506178" font-weight="400">Raw envelopes</text><text x="893" y="487" font-size="22" fill="#506178" font-weight="400">and typed projections</text><path d="M1059 518L1059 566" fill="none" stroke="#6b7f96" stroke-width="2.5" marker-end="url(#mqttsuite-message-flow-arrow)"/><rect x="451" y="572" width="378" height="73" rx="18" fill="#e3f0ea" stroke="none"/><text x="475" y="617" font-size="22" fill="#14243b" font-weight="700">Another MQTT broker</text><rect x="870" y="572" width="378" height="73" rx="18" fill="#e3f0ea" stroke="none"/><text x="894" y="617" font-size="22" fill="#14243b" font-weight="700">MariaDB</text><text x="32" y="680" font-size="18" fill="#506178" font-weight="400">Illustrative message paths; applications are optional and can also work with existing brokers.</text></g></svg>
